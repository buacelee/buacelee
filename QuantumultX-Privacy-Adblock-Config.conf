# Quantumult X 配置 - 隐私优化 + 广告屏蔽 + 阿里/腾讯 DNS
# 日期：2026/02/01 制作

[general]
# 配置图片和资源解析器链接
profile_img_url=https://raw.githubusercontent.com/Orz-3/mini/none/qikuo.png
resource_parser_url=https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js
network_check_url=http://www.apple.com/library/test/success.html
server_check_url=http://cp.cloudflare.com/generate_204
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/Orz-3/Orz-3/master/QuantumultX/IP.js

[dns]
# 加密 DNS 服务器配置（阿里和腾讯）
server=https+tls://223.5.5.5            # 阿里公共 DNS
server=https+tls://119.29.29.29         # 腾讯公共 DNS
server=https+tls://223.6.6.6            # 阿里备用 DNS
server=https+tls://119.28.28.28         # 腾讯备用 DNS
server=/api.bilibili.com/223.5.5.5
server=/live.bilibili.com/223.6.6.6
server=/tencent.com/119.29.29.29
server=/jd.com/119.29.29.29
circumvent-ipv4-answer=127.0.0.1, 0.0.0.0
circumvent-ipv6-answer::
no-system
no-ipv6

[policy]
# 策略组分流
static=全球加速, 香港节点, 台湾节点, 日本节点, 狮城节点, proxy, direct
static=广告拦截, direct, reject
static=隐私保护, reject, direct

[server_remote]
# 可自定义代理订阅地址
https://example.com/your_proxy_subscription, tag=自定义代理节点, update-interval=86400, opt-parser=false, enabled=true

[filter_local]
# === 本地广告屏蔽规则 ===
# 常规广告（国内外平台）
host-suffix,ad.mob.com, reject
host-suffix,adservice.google.com, reject
host-suffix,googletagservices.com, reject
host-suffix,pagead2.googlesyndication.com, reject
host-suffix,ads.youtube.com, reject
host-suffix,analytics.facebook.com, reject
host-suffix,tiktokv.com, reject
host-suffix,log.snssdk.com, reject
host-suffix,push.prod.miui.com, reject
host-suffix,umeng.cloud.com, reject
host-suffix,umeng.com, reject
# 国内平台广告
host-suffix,adsmzdm.com, reject         # 什么值得买
host-suffix,ad.api.3.cn, reject         # 京东广告
host-suffix,ads.youku.com, reject       # 优酷广告
host-suffix,api.mob.app.letv.com, reject # 乐视
host-suffix,security.iqiyi.com, reject
host-suffix,tz.kuaishou.com, reject     # 快手广告
# 隐私追踪相关
host-suffix,track.appsflyer.com, reject
host-suffix,bdtj.tagtic.cn, reject
host-suffix,track.userleap.com, reject

[rewrite_local]
# 视频平台广告屏蔽
^https?:\/\/miads\.qq\.com\/.* url reject-200
^https?:\/\/.*\.iqiyi\.com\/interface\/ad url reject-200
^https?:\/\/video\.qq\.com\/api\/get_hot\? url reject-200
^https?:\/\/api.bilibili.com\/x\/v2\/view\/ad url reject-200
^https?:\/\/api.bilibili.com\/pgc\/ad url reject-200
^https?:\/\/api.kuaishou.com\/rest\/n\/ads\/ url reject-200
^https?:\/\/www\.smzdm\.com\/api\/(ad|ads).* url reject-200
^https?:\/\/mp\.weixin\.qq\.com\/mp\/advert.* url reject-200
# 快手、今日头条等常见平台
^https?:\/\/.*\.pangle\.com\/.*ad.* url reject-200
^https?:\/\/log\.snssdk\.com\/.*ad.* url reject-200

[filter_remote]
# === 自动更新的远程规则 ===
# 综合广告拦截
https://adguardteam.github.io/AdGuardFilters/Filters/filter.txt, tag=AdGuard 综合过滤, update-interval=86400, opt-parser=true, enabled=true
https://github.com/privacy-protection-tools/anti-ad/raw/main/anti-ad-filter.txt, tag=Anti-AD 超强广告拦截, update-interval=86400, opt-parser=true, enabled=true
# 隐私保护规则
https://filters.adtidy.org/extension/chromium/filters/2_optimized.txt, tag=隐私保护规则, update-interval=86400, opt-parser=true, enabled=true

[rewrite_remote]
# 常用去广告模块
https://raw.githubusercontent.com/Maasea/sgmodule/master/YouTube.Adblock.sgmodule, tag=YouTube 去广告模块, update-interval=86400, opt-parser=true, enabled=true
https://raw.githubusercontent.com/app2smile/rules/master/module/tieba-qx.conf, tag=贴吧去广告模块, update-interval=86400, opt-parser=true, enabled=true

[task_local]
# 流媒体检测脚本（可选）
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js, tag=流媒体解锁检测, enabled=true